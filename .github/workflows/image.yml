# Build the Docker image natively on x86-64 and ARM64 runners, run every
# demo in it, and publish one multi-architecture image to
# ghcr.io/<owner>/ibook-g3-rtems. Pull requests build and test without
# publishing.
#
# Docker Desktop on macOS and Windows runs Linux containers in a Linux VM
# of the host's architecture, so these two images serve every host:
# linux/amd64 for x86-64 Linux, Intel Macs and x64 Windows, linux/arm64
# for ARM64 Linux, Apple Silicon and Windows on ARM. The host's C library
# (glibc, musl) does not matter; the image brings its own.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ibook-g3-rtems
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      # one architecture's failure shouldn't cancel the other's build
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # the first build compiles GCC from source; later ones reuse the cache
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GCC's build tree and the image layers need more than the runner's
      # free space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: ibook-g3-rtems:ci
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.arch) || '' }}

      # as an unprivileged user with a host directory mounted, the way the
      # README runs your own program
      - name: Run every demo
        run: |
          mkdir -m 777 smoke
          docker run --rm --user 1001:1001 -v "$PWD/smoke:/out" \
            ibook-g3-rtems:ci tools/smoke-test.sh /out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke/
          if-no-files-found: ignore

      # the tested build again, from the builder's cache, pushed by digest
      # with its provenance and SBOM
      - id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Record the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          d='${{ steps.push.outputs.digest }}'
          touch "digests/${d#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create the multi-architecture image
        working-directory: digests
        env:
          META: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$META")
          while read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$META")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
